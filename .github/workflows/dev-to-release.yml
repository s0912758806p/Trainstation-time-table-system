# dev 有新提交時，自動開 dev → release 的 PR 並立即合併。
# 使用內建 GITHUB_TOKEN（不會過期）。release 沒有分支保護、儲存庫也未開啟 auto-merge，
# 所以直接合併；若日後加上必要檢查，改成 `gh pr merge --auto`。
# 注意：Vercel 正式環境部署自 main，release → main 仍需手動合併。
name: Dev to Release Auto PR & Merge
on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dev-to-release
  cancel-in-progress: false

jobs:
  create-and-merge-pr:
    if: ${{ !contains(github.event.head_commit.message, '[skip-release]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open and merge dev → release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AHEAD=$(git rev-list --count origin/release..origin/dev)
          if [ "$AHEAD" = "0" ]; then
            echo "release already contains dev; nothing to do."
            exit 0
          fi
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head dev --base release --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base release --head dev \
              --title "chore: Merge dev to release [automated]" \
              --body "Automated merge from dev to release, triggered by ${GITHUB_ACTOR} at ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}."
            PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head dev --base release --state open --json number --jq '.[0].number')
          fi
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$(git rev-parse origin/dev)"
          echo "✅ Merged #$PR into release"
