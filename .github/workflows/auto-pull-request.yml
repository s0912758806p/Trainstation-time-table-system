# 功能分支推送後，自動開一個 PR 到 dev（已有 PR 時略過）。
# 使用內建 GITHUB_TOKEN，不需要會過期的個人存取權杖。
# 前提：Settings → Actions → General 勾選「Allow GitHub Actions to create and approve pull requests」。
name: Auto Pull Request
on:
  push:
    branches-ignore:
      - dev
      - main
      - release

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open PR to dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$(git rev-list --count origin/dev..HEAD)" = "0" ]; then
            echo "No commits ahead of dev; nothing to open."
            exit 0
          fi
          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base dev --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "PR from $BRANCH to dev already exists."
            exit 0
          fi
          AUTHOR=$(git log -1 --pretty=format:'%an')
          TITLE=$(git log -1 --pretty=format:'%s')
          BODY=$(printf '## Automatic pull request from `%s`\n\nLast commit by %s: %s/%s/commit/%s\n' \
            "$BRANCH" "$AUTHOR" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA")
          gh pr create --repo "$GITHUB_REPOSITORY" --base dev --head "$BRANCH" --title "$TITLE" --body "$BODY"
