# 每次推送都跑 lint、型別檢查、單元測試、正式建置與 Playwright 端對端測試
# （不需要 TDX 金鑰，一律使用模擬資料）。E2E 失敗時會上傳 playwright-report 供下載檢視。
# - dev 不在這裡跑：dev-to-release.yml 會先呼叫本 workflow（workflow_call），通過才合併到 release，
#   避免同一個提交跑兩次。
# - 不使用 pull_request 觸發：同一個 repo 的分支已由 push 觸發，結果會顯示在 PR 上；而機器人
#   （GITHUB_TOKEN）開的 PR 觸發的執行會卡在「等待核准」，只會留下雜訊。代價是 fork 來的 PR 不會自動跑 CI。
# - 用 GITHUB_TOKEN 完成的合併不會觸發 push，所以 release 的自動合併不會再跑一次。
name: CI
on:
  push:
    branches-ignore:
      - dev
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
